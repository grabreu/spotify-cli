[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spotify-cli"
version = "0.1.0"
description = "Interactive CLI that exports a Spotify playlist you own or collaborate on as CSV or JSON."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Gabriel Abreu" }]
keywords = ["cli", "spotify", "playlist", "csv", "json"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]
dependencies = [
    "typer>=0.12",
    "questionary>=2.0",
    "spotipy>=2.24",
    "pydantic-settings>=2.5",
]

[project.urls]
Repository = "https://github.com/grabreu/spotify-cli"
Issues = "https://github.com/grabreu/spotify-cli/issues"

[project.scripts]
spotify-cli = "spotify_cli.cli:app"

[dependency-groups]
dev = ["ruff>=0.6", "mypy>=1.11", "pytest>=8.3"]

[tool.hatch.build.targets.wheel]
packages = ["src/spotify_cli"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.mypy]
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "spotipy.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
